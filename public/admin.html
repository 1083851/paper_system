<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>迷宮學園 - 研究者監控後台 (穩定整合版)</title>
  
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/zh-hant.js"></script>

  <style>
    /* 核心佈局與視覺美化 */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    header { border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    h2 { margin: 0; color: #1a73e8; display: flex; align-items: center; gap: 10px; }
    
    /* 統計看板 */
    .stats-row { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat-card { flex: 1; background: #fff; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #eef0f2; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stat-num { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
    .stat-label { font-size: 14px; color: #666; font-weight: 500; }
    
    /* 表格樣式 */
    table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 8px; }
    th { background: #f8f9fa; color: #5f6368; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: #f8fbff; }
    
    /* 狀態與標籤 */
    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .online { background-color: #34a853; box-shadow: 0 0 8px rgba(52, 168, 83, 0.4); }
    .offline { background-color: #dadce0; }
    
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-ai { background: #e8f0fe; color: #1a73e8; border: 1px solid #d2e3fc; }
    .badge-control { background: #fce8e6; color: #d93025; border: 1px solid #fad2cf; }
    
    /* 按鈕 */
    .btn-view { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .btn-view:hover { background: #1765cc; box-shadow: 0 2px 5px rgba(26, 115, 232, 0.3); }
    .btn-edit { background: #fff; color: #5f6368; border: 1px solid #dadce0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 8px; }
    .btn-edit:hover { background: #f1f3f4; color: #3c4043; }

    /* Modal 視窗 */
    #modal-overlay, #edit-overlay { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(32, 33, 36, 0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px);
    }
    .modal-box { background: white; width: 90%; height: 85%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 15px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .modal-body { display: flex; flex: 1; overflow: hidden; background: #f1f3f4; }
    
    /* 預覽區佈局 */
    .preview-game { width: 340px; padding: 25px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; }
    .preview-blockly { flex: 1; height: 100%; background: #fff; }
    canvas { border: 1px solid #bdc1c6; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    
    /* 編輯對話框 */
    .edit-box { background: white; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .edit-box label { display: block; margin-top: 18px; font-size: 14px; color: #5f6368; font-weight: 500; }
    .edit-box input, .edit-box select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
        <h2><span>🛠️ 研究者監控後台</span></h2>
        <div>
            <button onclick="openCreateModal()" class="btn-view" style="background:#34a853">➕ 新增受試者</button>
            <button onclick="fetchUsers()" class="btn-view">🔄 手動刷新數據</button>
            <button onclick="location.href='login.html'" class="btn-edit">🏠 回首頁</button>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-num" id="total-users">0</div>
            <div class="stat-label">總受試者</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="online-users" style="color:#34a853">0</div>
            <div class="stat-label">當前活動中</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="ai-count" style="color:#1a73e8">0</div>
            <div class="stat-label">AI 實驗組 (AI)</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="control-count" style="color:#d93025">0</div>
            <div class="stat-label">一般對照組 (Control)</div>
        </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>狀態</th>
          <th>受試者帳號</th>
          <th>實驗分組</th>
          <th>當前進度</th>
          <th>最後活躍時間</th>
          <th>遠端操作</th>
        </tr>
      </thead>
      <tbody id="user-table">
        <tr><td colspan="6" style="text-align:center; padding:40px; color:#999;">🔍 正在連線至 MongoDB 獲取數據...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span id="modal-title">實時行為監控：<span id="monitoring-name" style="color:#1a73e8">-</span></span>
            <button onclick="closeModal()" class="btn-view" style="background:#5f6368">結束監控</button>
        </div>
        <div class="modal-body">
            <div class="preview-game">
                <canvas id="previewCanvas" width="280" height="280"></canvas>
                <div style="margin-top:20px; font-size:14px; color:#3c4043; width: 100%;">
                    <p><strong>📍 當前關卡：</strong> <span id="monitoring-level" style="color:#1a73e8; font-weight:bold;">-</span></p>
                    <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
                    <p style="font-size: 12px; color:#70757a; line-height: 1.8;">
                        🏁 <span style="color:#d93025">紅點</span>：玩家起始點<br>
                        🏆 <span style="color:#f9ab00">黃格</span>：目標終點<br>
                        🧱 <span style="color:#3c4043">深灰</span>：不可通行障礙
                    </p>
                </div>
            </div>
            <div id="modal-blockly" class="preview-blockly"></div>
        </div>
    </div>
  </div>

  <div id="edit-overlay">
    <div class="edit-box">
        <h3 id="edit-user-title">個體參數調整</h3>
        <label>組別重置：</label>
        <select id="edit-group">
            <option value="AI">AI 實驗組 (提供貓導師)</option>
            <option value="Control">一般對照組 (純淨環境)</option>
        </select>

        <label>重設密碼 (若不修改請留空)：</label>
        <input type="password" id="edit-password" placeholder="輸入新密碼">

        <div style="display:flex; gap:12px; margin-top:30px;">
            <button onclick="submitEdit()" style="flex:1; padding:12px; background:#1a73e8; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">確認儲存</button>
            <button onclick="closeEditModal()" style="flex:1; padding:12px; background:#f1f3f4; color:#3c4043; border:none; border-radius:6px; cursor:pointer">取消</button>
        </div>
    </div>
  </div>

  <xml id="toolbox" style="display:none"></xml> 

  <script>
    const API_URL = "http://localhost:3000";
    const token = localStorage.getItem("token");
    let selectedUserData = null; 
    let viewerWorkspace = null;

    function initViewer() {
        if (!viewerWorkspace) {
            Blockly.defineBlocksWithJsonArray([
              { "type": "maze_move", "message0": "向前移動", "previousStatement": null, "nextStatement": null, "colour": 290 },
              { "type": "maze_turn", "message0": "向 %1 轉", "args0": [{ "type": "field_dropdown", "name": "DIRECTION", "options": [["左", "LEFT"], ["右", "RIGHT"]] }], "previousStatement": null, "nextStatement": null, "colour": 290 }
            ]);
            viewerWorkspace = Blockly.inject('modal-blockly', {
                readOnly: true, scrollbars: true,
                toolbox: document.getElementById('toolbox')
            });
        }
    }

    async function fetchUsers() {
        if (!token) { window.location.href = "login.html"; return; }
        try {
            const res = await fetch(`${API_URL}/api/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.status === 403) { alert("無權限，請使用管理員帳號登入。"); window.location.href = "login.html"; return; }
            const users = await res.json();
            renderTable(users);
            updateStats(users);

            // 如果監控中，即時更新
            if (selectedUserData && document.getElementById('modal-overlay').style.display === 'flex') {
                const target = users.find(u => u.username === selectedUserData.username);
                if (target) {
                    if (target.lastXml) updateWorkspace(target.lastXml);
                    drawMazeOnly(target.currentLevel || 1);
                }
            }
        } catch (e) { console.error("API連線失敗", e); }
    }

    function renderTable(users) {
        const tbody = document.getElementById('user-table');
        tbody.innerHTML = '';
        const now = new Date();
        users.forEach(user => {
            const lastActive = new Date(user.lastActive);
            const isOnline = (now - lastActive)/1000/60 < 2; // 2分鐘內算在線
            const row = `
                <tr>
                    <td><span class="status-dot ${isOnline?'online':'offline'}"></span> ${isOnline?'活動中':'離線'}</td>
                    <td><strong>${user.username}</strong></td>
                    <td><span class="badge ${user.group === 'AI' ? 'badge-ai' : 'badge-control'}">${user.group === 'AI' ? '實驗組 (AI)' : '對照組 (Control)'}</span></td>
                    <td style="font-weight:bold; color:#1a73e8;">Level ${user.currentLevel || 1}</td>
                    <td style="color:#70757a; font-size:12px">${lastActive.toLocaleString('zh-TW')}</td>
                    <td>
                        <button onclick="viewUser('${user.username}')" class="btn-view">監控</button>
                        <button onclick="openEditModal('${user.username}', '${user.group}')" class="btn-edit">管理</button>
                    </td>
                </tr>`;
            tbody.innerHTML += row;
        });
    }

    function updateStats(users) {
        const now = new Date();
        document.getElementById('total-users').innerText = users.length;
        document.getElementById('online-users').innerText = users.filter(u => (now - new Date(u.lastActive))/1000/60 < 2).length;
        document.getElementById('ai-count').innerText = users.filter(u => u.group === 'AI').length;
        document.getElementById('control-count').innerText = users.filter(u => u.group === 'Control').length;
    }

    function viewUser(username) {
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('monitoring-name').innerText = username;
        selectedUserData = { username: username }; 
        initViewer();
        fetchUsers(); 
    }

    function updateWorkspace(jsonString) {
        try {
            const state = typeof jsonString === 'string' ? JSON.parse(jsonString) : jsonString;
            viewerWorkspace.clear();
            Blockly.serialization.workspaces.load(state, viewerWorkspace);
            // 自動居中顯示
            viewerWorkspace.scrollCenter();
        } catch(e) { console.warn("XML解析失敗", e); }
    }

    function drawMazeOnly(level) {
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const currentMap = maps[level - 1] || maps[0];
        const rows = currentMap.length;
        const cols = currentMap[0].length;
        const cellSize = 280 / Math.max(rows, cols);

        document.getElementById('monitoring-level').innerText = `Level ${level}`;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (currentMap[y][x] === 1) ctx.fillStyle = "#3c4043"; // 牆
                else if (currentMap[y][x] === 3) ctx.fillStyle = "#f9ab00"; // 終點
                else ctx.fillStyle = "#fff";
                
                ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                ctx.strokeStyle = "#e8eaed";
                ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);

                if (currentMap[y][x] === 2) {
                    ctx.fillStyle = "#d93025"; // 起點玩家
                    ctx.beginPath();
                    ctx.arc(x * cellSize + cellSize/2, y * cellSize + cellSize/2, cellSize/4, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; selectedUserData = null; }

    function openEditModal(username, group) {
        selectedUserData = { username, group };
        document.getElementById('edit-user-title').innerText = `管理：${username}`;
        document.getElementById('edit-group').value = group;
        document.getElementById('edit-password').value = "";
        document.getElementById('edit-overlay').style.display = 'flex';
    }

    function closeEditModal() { document.getElementById('edit-overlay').style.display = 'none'; }

    async function submitEdit() {
        const newGroup = document.getElementById('edit-group').value;
        const newPassword = document.getElementById('edit-password').value;

        try {
            await fetch(`${API_URL}/api/admin/update-group`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ targetUsername: selectedUserData.username, newGroup: newGroup })
            });

            if (newPassword.trim() !== "") {
                await fetch(`${API_URL}/api/admin/update-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ targetUsername: selectedUserData.username, newPassword: newPassword })
                });
            }

            alert("參數更新成功！");
            closeEditModal();
            fetchUsers();
        } catch (e) { alert("更新失敗，請檢查權限或伺服器連線。"); }
    }

    // 初始化與循環刷新
    fetchUsers();
    setInterval(fetchUsers, 5000); 
    // --- 新增帳號相關功能 ---

function openCreateModal() {
    document.getElementById('create-username').value = "";
    document.getElementById('create-password').value = "";
    document.getElementById('create-overlay').style.display = 'flex';
}

function closeCreateModal() {
    document.getElementById('create-overlay').style.display = 'none';
}

async function submitCreate() {
    const username = document.getElementById('create-username').value.trim();
    const password = document.getElementById('create-password').value.trim();
    const group = document.getElementById('create-group').value;

    if (!username || !password) {
        alert("請輸入完整的帳號與密碼！");
        return;
    }

    try {
        // 注意：這裡假設您的後端 API 路徑為 /api/admin/create-user
        // 如果您的 API 路徑不同，請修改此處
        const res = await fetch(`${API_URL}/api/admin/create-user`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify({ 
                username: username, 
                password: password, 
                group: group 
            })
        });

        const result = await res.json();

        if (res.ok) {
            alert("帳號創建成功！");
            closeCreateModal();
            fetchUsers(); // 刷新列表
        } else {
            alert("創建失敗：" + (result.message || "未知錯誤"));
        }
    } catch (e) {
        console.error("API連線失敗", e);
        alert("連線到伺服器時發生錯誤。");
    }
}
  </script>
  <div id="create-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 33, 36, 0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px);">
    <div class="edit-box">
        <h3>➕ 創建新受試者</h3>
        <label>受試者帳號 (Username)：</label>
        <input type="text" id="create-username" placeholder="例如: user001">

        <label>初始密碼：</label>
        <input type="password" id="create-password" placeholder="建議 6 位數以上">

        <label>指派實驗分組：</label>
        <select id="create-group">
            <option value="AI">AI 實驗組 (提供貓導師)</option>
            <option value="Control" selected>一般對照組 (純淨環境)</option>
        </select>

        <div style="display:flex; gap:12px; margin-top:30px;">
            <button onclick="submitCreate()" style="flex:1; padding:12px; background:#34a853; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">執行創建</button>
            <button onclick="closeCreateModal()" style="flex:1; padding:12px; background:#f1f3f4; color:#3c4043; border:none; border-radius:6px; cursor:pointer">取消</button>
        </div>
    </div>
</div>
</body>
</html>
